name: Release

on:
  push:
    tags:
      - 'v*.*.*-r*'
  workflow_dispatch:
    inputs:
      version:
        description: "New fork version, e.g. v3.9.0-r4 (run on main)"
        required: true
        type: string

# Serial releases prevent concurrent versions from racing the latest tags.
concurrency:
  group: mailflow-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    # Required to see existing drafts when resuming a failed release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve and validate release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            echo 'Run releases from main' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          # An API failure must not be mistaken for an absent latest release.
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          tag=$(python3 scripts/release-policy.py "$REQUESTED_VERSION" --latest "$latest")
          tag_commit=''
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            git merge-base --is-ancestor "$tag_commit" origin/main
          fi
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          # A repaired workflow may run at newer main while all payloads keep the
          # existing draft's original tag commit. Published releases remain immutable.
          commit=$(python3 scripts/resolve-release-commit.py --head "$GITHUB_SHA" --tag-commit "$tag_commit" --draft "${existing:-missing}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  prepare:
    needs: [resolve, checks]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # GITHUB_TOKEN-created refs do not recursively trigger tag workflows.
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" >/dev/null
          fi
          releases=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | [.tag_name, .draft] | @tsv')
          existing=$(printf '%s\n' "$releases" | awk -v tag="$RELEASE_TAG" '$1 == tag {print $2}')
          if [[ -n "$existing" ]]; then
            [[ "$existing" == true ]] || { echo 'Refusing to overwrite a published release' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "MailFlow $RELEASE_TAG"
          fi

  apps:
    needs: [resolve, prepare]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-apps.yml
    with:
      version: ${{ needs.resolve.outputs.tag }}
      draft: true
    secrets: inherit

  images:
    needs: [resolve, prepare]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Resolve lowercase image namespace
        id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]] || { echo "Invalid fork release tag: $RELEASE_TAG" >&2; exit 1; }
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/mailflow-backend
          tags: |
            type=raw,value=${{ steps.namespace.outputs.version }}
          flavor: |
            latest=false

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ needs.resolve.outputs.commit }}
            APP_VERSION=${{ needs.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/mailflow-frontend
          tags: |
            type=raw,value=${{ steps.namespace.outputs.version }}
          flavor: |
            latest=false

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [resolve, images, apps]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify assets, promote images and publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 scripts/verify-release-assets.py "$RELEASE_TAG" "$RUNNER_TEMP/release-assets.json"
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/mailflow-$component"
            docker buildx imagetools inspect "$image:${RELEASE_TAG#v}" --raw > "$RUNNER_TEMP/$component-version.json"
            python3 scripts/verify-release-image.py "$RUNNER_TEMP/$component-version.json"
          done
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/mailflow-$component"
            docker buildx imagetools create --tag "$image:latest" "$image:${RELEASE_TAG#v}"
            docker buildx imagetools inspect "$image:latest" --raw > "$RUNNER_TEMP/$component-latest.json"
            cmp "$RUNNER_TEMP/$component-version.json" "$RUNNER_TEMP/$component-latest.json"
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published $RELEASE_TAG with verified multi-architecture images and desktop assets." >> "$GITHUB_STEP_SUMMARY"
