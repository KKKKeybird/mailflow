name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: "Exact release commit to validate"
        type: string
        default: ""
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Lint release workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -shellcheck= .github/workflows/ci.yml .github/workflows/publish.yml .github/workflows/publish-apps.yml
      - name: Validate release policy
        run: |
          bash -n scripts/release.sh
          python3 scripts/test_release_policy.py

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Plugin boundary
        working-directory: backend
        run: npm run lint:plugins

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Test
        working-directory: backend
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  sender-grouping:
    name: Sender grouping and migrations (PostgreSQL)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mailflow_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Verify clean startup and migration idempotence
        env:
          DB_NAME: mailflow_migrations_test
        run: |
          node --input-type=module <<'JS'
          const { runMigrations } = await import('./backend/src/services/migrations.js');
          const { pool } = await import('./backend/src/services/db.js');
          try { await runMigrations(); await runMigrations(); }
          finally { await pool.end(); }
          JS
      - name: Fetch selected upstream baseline (read only)
        run: git fetch https://github.com/maathimself/mailflow.git refs/tags/v3.9.0:refs/tags/v3.9.0
      - name: Seed disposable sender grouping database
        run: |
          createdb mailflow_sender_revision
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/benchmarks/senderGrouping.sql
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/migrations/0063_normalized_sender_index.sql
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/migrations/0064_sender_thread_source_index.sql
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/migrations/0066_sender_identity_preferences.sql
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/migrations/0067_sender_identity_index.sql
          psql -d mailflow_sender_revision -v ON_ERROR_STOP=1 -f backend/benchmarks/senderIdentityMigration.sql
      - name: Validate real list endpoint against upstream
        env:
          DB_NAME: mailflow_sender_revision
          BENCH_BASE_REF: v3.9.0
          BENCH_VALIDATE: "1"
        run: node backend/benchmarks/senderGrouping.mjs
